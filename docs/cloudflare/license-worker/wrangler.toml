name = "focusin-license"
main = "worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 部署後設定 Secrets：
#   wrangler secret put LICENSE_SEED   # Ed25519 私鑰 seed（raw 32B base64）
#   wrangler secret put ADMIN_KEY      # 官網發 key 管理密碼
#   wrangler secret put LICENSE_PUB    # 公鑰 raw 32B base64

# 簽發記錄儲存（後台列表）
[[kv_namespaces]]
binding = "LICENSE_KV"
id = "213770bfb6ed419b919a8181d61dc5c7"

[observability]
enabled = true
