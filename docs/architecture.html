<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClassroomManager 课堂管理架构示意</title>
</head>
<body style="margin:0;padding:16px;background:#f1f5f9;font-family:-apple-system,'PingFang SC','Helvetica Neue',sans-serif;">

<div style="max-width:1060px;margin:0 auto;">
  <h1 style="font-size:20px;color:#0f172a;margin:4px 0 12px;">ClassroomManager — 教师端 / 学生端 课堂管理架构（示意）</h1>

  <div style="width:100%;box-sizing:border-box;overflow-x:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:8px;">
  <svg viewBox="0 0 1020 790" width="100%" style="min-width:820px;display:block;" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="课堂管理架构示意图">
    <defs>
      <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
      </marker>
      <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
      </marker>
    </defs>

    <!-- ============ 教师端 ============ -->
    <rect x="40" y="40" width="940" height="170" rx="16" fill="#eaf2ff" stroke="#2563eb" stroke-width="2"/>
    <text x="60" y="76" font-size="18" font-weight="700" fill="#1e3a8a">教师端 TeacherApp（iMac）</text>

    <rect x="66" y="92" width="280" height="100" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="82" y="120" font-size="14" font-weight="700" fill="#1e3a8a">PeerBrowser</text>
    <text x="82" y="143" font-size="13" fill="#334155">Bonjour 自动发现学生端</text>
    <text x="82" y="163" font-size="13" fill="#334155">（NWBrowser · mDNS）</text>

    <rect x="370" y="92" width="280" height="100" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="386" y="120" font-size="14" font-weight="700" fill="#1e3a8a">ScreenBroadcaster</text>
    <text x="386" y="143" font-size="13" fill="#334155">ScreenCaptureKit 采集教师屏幕</text>
    <text x="386" y="163" font-size="13" fill="#334155">→ JPEG 帧（5fps · 半分辨率）</text>

    <rect x="674" y="92" width="280" height="100" rx="10" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
    <text x="690" y="120" font-size="14" font-weight="700" fill="#1e3a8a">CommandCenter</text>
    <text x="690" y="143" font-size="13" fill="#334155">lock / unlock / shutdown / restart</text>
    <text x="690" y="163" font-size="13" fill="#334155">launchApp · 目标选择（全部/单个）</text>

    <!-- ============ 通道区 ============ -->
    <line x1="250" y1="212" x2="250" y2="310" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5"
          marker-start="url(#arrowDashed)" marker-end="url(#arrowDashed)"/>
    <text x="268" y="248" font-size="13" fill="#475569">Bonjour mDNS 自动发现</text>
    <text x="268" y="268" font-size="12" fill="#64748b">服务类型 _classroom-ctrl._tcp.（UDP 5353）</text>

    <line x1="520" y1="212" x2="520" y2="310" stroke="#2563eb" stroke-width="2.5"
          marker-start="url(#arrowSolid)" marker-end="url(#arrowSolid)"/>
    <text x="538" y="248" font-size="13" font-weight="600" fill="#1d4ed8">WebSocket 双向通道</text>
    <text x="538" y="268" font-size="12" fill="#475569">控制命令 + 屏幕帧（TCP 4477）</text>
    <text x="538" y="288" font-size="12" fill="#475569">JSON 信封 · 帧为 base64 JPEG</text>

    <rect x="760" y="214" width="230" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="776" y="240" font-size="13" font-weight="700" fill="#334155">图例</text>
    <line x1="778" y1="260" x2="818" y2="260" stroke="#2563eb" stroke-width="2.5"
          marker-start="url(#arrowSolid)" marker-end="url(#arrowSolid)"/>
    <text x="824" y="264" font-size="12" fill="#475569">WebSocket TCP 连接</text>
    <line x1="778" y1="282" x2="818" y2="282" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 5"
          marker-start="url(#arrowDashed)" marker-end="url(#arrowDashed)"/>
    <text x="824" y="286" font-size="12" fill="#475569">Bonjour mDNS 发现</text>
    <text x="776" y="302" font-size="11" fill="#94a3b8">示意图，非精确拓扑</text>

    <!-- ============ 学生端 ×3 ============ -->
    <!-- #1 -->
    <rect x="70" y="330" width="290" height="290" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="88" y="364" font-size="16" font-weight="700" fill="#14532d">StudentApp · 学生端 #1</text>
    <text x="88" y="396" font-size="13" fill="#166534">• PeerAdvertiser — 广告 Bonjour 服务</text>
    <text x="88" y="422" font-size="13" fill="#166534">• CommandListener — 命令分发</text>
    <text x="88" y="448" font-size="13" fill="#166534">• Kiosk 锁窗 — 全屏覆盖所有显示器</text>
    <text x="88" y="474" font-size="13" fill="#166534">• InputInterceptor — 拦截输入</text>
    <text x="88" y="500" font-size="13" fill="#166534">• 广播画面实时显示于锁窗</text>
    <text x="88" y="540" font-size="12" font-style="italic" fill="#64748b">锁定时本机键盘/鼠标全部屏蔽</text>
    <text x="88" y="558" font-size="12" font-style="italic" fill="#64748b">（⌘⇥ · ⌘⌥⎋ · ⌃←/→ · 鼠标）</text>
    <line x1="190" y1="310" x2="190" y2="328" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowSolid)"/>

    <!-- #2 -->
    <rect x="365" y="330" width="290" height="290" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="383" y="364" font-size="16" font-weight="700" fill="#14532d">StudentApp · 学生端 #2</text>
    <text x="383" y="396" font-size="13" fill="#166534">• PeerAdvertiser — 广告 Bonjour 服务</text>
    <text x="383" y="422" font-size="13" fill="#166534">• CommandListener — 命令分发</text>
    <text x="383" y="448" font-size="13" fill="#166534">• Kiosk 锁窗 — 全屏覆盖所有显示器</text>
    <text x="383" y="474" font-size="13" fill="#166534">• InputInterceptor — 拦截输入</text>
    <text x="383" y="500" font-size="13" fill="#166534">• 广播画面实时显示于锁窗</text>
    <text x="383" y="540" font-size="12" font-style="italic" fill="#64748b">锁定时本机键盘/鼠标全部屏蔽</text>
    <text x="383" y="558" font-size="12" font-style="italic" fill="#64748b">（⌘⇥ · ⌘⌥⎋ · ⌃←/→ · 鼠标）</text>
    <line x1="510" y1="310" x2="510" y2="328" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowSolid)"/>

    <!-- #3 -->
    <rect x="660" y="330" width="290" height="290" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="678" y="364" font-size="16" font-weight="700" fill="#14532d">StudentApp · 学生端 #3 …</text>
    <text x="678" y="396" font-size="13" fill="#166534">• PeerAdvertiser — 广告 Bonjour 服务</text>
    <text x="678" y="422" font-size="13" fill="#166534">• CommandListener — 命令分发</text>
    <text x="678" y="448" font-size="13" fill="#166534">• Kiosk 锁窗 — 全屏覆盖所有显示器</text>
    <text x="678" y="474" font-size="13" fill="#166534">• InputInterceptor — 拦截输入</text>
    <text x="678" y="500" font-size="13" fill="#166534">• 广播画面实时显示于锁窗</text>
    <text x="678" y="540" font-size="12" font-style="italic" fill="#64748b">锁定时本机键盘/鼠标全部屏蔽</text>
    <text x="678" y="558" font-size="12" font-style="italic" fill="#64748b">（⌘⇥ · ⌘⌥⎋ · ⌃←/→ · 鼠标）</text>
    <line x1="830" y1="310" x2="830" y2="328" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrowSolid)"/>

    <!-- ============ 紧急解锁通道 ============ -->
    <rect x="40" y="648" width="940" height="122" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="60" y="680" font-size="15" font-weight="700" fill="#9a3412">紧急解锁通道（本地管理员 · 断网可用）</text>
    <text x="60" y="708" font-size="13" fill="#7c2d12">① 本地按 ⌘⇧U → 输入拦截器暂停 → 锁窗弹出密码框 → ② 加盐 SHA-256 校验管理员密码</text>
    <text x="60" y="730" font-size="13" fill="#7c2d12">③ 校验通过：退出 Kiosk，恢复系统界面　｜　校验失败 / 60 秒超时：恢复输入拦截，保持锁定</text>
    <text x="60" y="754" font-size="12" fill="#b45309">密码仅存哈希（KioskConfig），部署时于学生端状态窗口预设；教师可随时远程 unlock。</text>
  </svg>
  </div>
</div>
</body>
</html>
